<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Up?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f0e8;
            --surface: #fbf8f3;
            --surface-alt: #f0eadf;
            --ink: #1c1a17;
            --ink-soft: #4a463f;
            --muted: #8a847b;
            --border: #e2dccf;
            --border-strong: #c9c0ad;
            --accent: #8b6f47;
            --accent-soft: #c4a98a;
            --success: #6b7d5e;
            --absent: #b8b0a3;
        }

        html, body { background: var(--bg); }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            font-weight: 400;
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* ===== HEADER ===== */
        .site-header {
            border-bottom: 1px solid var(--border);
            padding: 1.75rem 2rem 0;
            background: var(--bg);
        }
        .site-header-inner {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }
        .brand {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            letter-spacing: -0.01em;
            color: var(--ink);
        }
        .brand em {
            font-style: italic;
            font-weight: 300;
            color: var(--accent);
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 2.5rem;
        }
        .tab {
            background: none;
            border: none;
            padding: 0.5rem 0 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--muted);
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }
        .tab:hover { color: var(--ink); }
        .tab.active { color: var(--ink); }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--ink);
        }

        /* ===== LAYOUT ===== */
        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 3rem 2rem 5rem;
        }
        .panel { display: none; }
        .panel.active { display: block; }

        .section-head {
            margin-bottom: 2rem;
        }
        .eyebrow {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.65rem;
        }
        .section-head h2 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            font-size: clamp(1.75rem, 3.5vw, 2.4rem);
            letter-spacing: -0.015em;
            line-height: 1.15;
            color: var(--ink);
        }
        .section-head p {
            color: var(--ink-soft);
            font-size: 0.95rem;
            margin-top: 0.65rem;
            max-width: 36rem;
        }

        /* ===== ATTENDANCE ===== */
        .roster-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 1rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
            flex-wrap: wrap;
        }
        .count-display {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            font-size: 0.95rem;
            color: var(--ink-soft);
        }
        .count-display strong {
            font-weight: 500;
            color: var(--ink);
            font-size: 1.05rem;
        }
        .count-display .divider {
            color: var(--border-strong);
            margin: 0 0.6rem;
        }

        .roster-actions { display: flex; gap: 0.5rem; }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0;
            border-top: 1px solid var(--border);
        }
        .roster-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.95rem 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s ease;
            user-select: none;
        }
        .roster-row:hover { background: var(--surface); }
        .roster-name {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--ink);
            transition: color 0.15s ease;
        }
        .roster-row.absent .roster-name {
            color: var(--absent);
            text-decoration: line-through;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--border-strong);
        }
        .check {
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            transition: all 0.15s ease;
            position: relative;
            flex-shrink: 0;
        }
        .roster-row:not(.absent) .check {
            background: var(--ink);
            border-color: var(--ink);
        }
        .roster-row:not(.absent) .check::after {
            content: '';
            position: absolute;
            top: 3px; left: 6px;
            width: 3px;
            height: 7px;
            border-right: 1.5px solid var(--bg);
            border-bottom: 1.5px solid var(--bg);
            transform: rotate(45deg);
        }

        .add-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
            max-width: 360px;
        }
        input[type="text"] {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 0.7rem 0.9rem;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.15s ease;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--ink);
        }
        input[type="text"]::placeholder { color: var(--muted); }

        /* ===== BUTTONS ===== */
        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 0.75rem 1.4rem;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink);
        }
        .btn-primary:hover { background: var(--ink-soft); border-color: var(--ink-soft); }
        .btn-outline {
            background: transparent;
            color: var(--ink);
            border-color: var(--border-strong);
        }
        .btn-outline:hover { border-color: var(--ink); }
        .btn-link {
            background: none;
            border: none;
            color: var(--ink-soft);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border-strong);
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-link:hover { color: var(--ink); border-color: var(--ink); }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--ink);
            color: var(--bg);
            padding: 0.7rem 1.25rem;
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            border-radius: 2px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== SPINNER ===== */
        .spinner-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 4rem;
            align-items: start;
        }
        .wheel-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
        }
        .winner-display {
            min-height: 5.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .winner-label {
            font-size: 0.7rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .winner-label.show { opacity: 1; }
        .winner-name {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            font-style: italic;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            letter-spacing: -0.01em;
            color: var(--ink);
            line-height: 1.1;
            margin-top: 0.4rem;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        .winner-name.show {
            opacity: 1;
            transform: translateY(0);
        }

        .wheel-wrapper {
            position: relative;
            display: inline-block;
        }
        .wheel-pointer {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 18px solid var(--ink);
        }
        #wheel-canvas {
            border-radius: 50%;
            background: var(--surface);
            transition: filter 0.4s ease;
            max-width: 100%;
            height: auto;
        }
        #wheel-canvas.spinning { filter: saturate(1.05); }

        .spin-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.82rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            padding: 1.1rem 3rem;
            border-radius: 2px;
            border: 1px solid var(--ink);
            cursor: pointer;
            background: var(--ink);
            color: var(--bg);
            transition: all 0.2s ease;
        }
        .spin-btn:hover:not(:disabled) {
            background: transparent;
            color: var(--ink);
        }
        .spin-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .picked-side {
            padding-top: 0.5rem;
        }
        .picked-side h3 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 400;
            font-size: 1.25rem;
            margin-bottom: 0.3rem;
        }
        .picked-side .meta {
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1.25rem;
        }
        .picked-list {
            list-style: none;
            border-top: 1px solid var(--border);
        }
        .picked-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }
        .picked-list .index {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            color: var(--muted);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }
        .picked-empty {
            color: var(--muted);
            font-style: italic;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 0.95rem;
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--border);
        }
        .reset-link {
            margin-top: 1.25rem;
            display: inline-block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .spinner-layout { grid-template-columns: 1fr; gap: 2.5rem; }
            .picked-side { order: 2; }
        }
        @media (max-width: 520px) {
            .site-header { padding: 1.25rem 1.25rem 0; }
            .page { padding: 2rem 1.25rem 4rem; }
            .tabs { gap: 1.75rem; }
            .roster-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <header class="site-header">
        <div class="site-header-inner">
            <div class="brand">Who's <em>Up</em></div>
            <nav class="tabs">
                <button class="tab active" data-tab="attendance">Attendance</button>
                <button class="tab" data-tab="spinner">Spinner</button>
            </nav>
        </div>
    </header>

    <main class="page">
        <!-- ATTENDANCE -->
        <section id="attendance-panel" class="panel active">
            <div class="section-head">
                <div class="eyebrow">Step One</div>
                <h2>Today's roll</h2>
                <p>Tap a name to mark them absent. Add visitors below. Export when you're set.</p>
            </div>

            <div class="roster-bar">
                <div class="count-display">
                    <strong id="present-count">0</strong> present
                    <span class="divider">/</span>
                    <span id="absent-count">0</span> absent
                </div>
                <div class="roster-actions">
                    <button class="btn btn-outline" onclick="copyList()">Copy</button>
                    <button class="btn btn-primary" onclick="downloadList()">Export</button>
                </div>
            </div>

            <div class="roster-grid" id="roster-grid"></div>

            <div class="add-row">
                <input type="text" id="visitor-input" placeholder="Add a visitor…" autocomplete="off">
                <button class="btn btn-outline" onclick="addVisitor()">Add</button>
            </div>
        </section>

        <!-- SPINNER -->
        <section id="spinner-panel" class="panel">
            <div class="section-head">
                <div class="eyebrow">Step Two</div>
                <h2>Spin to pick</h2>
                <p>Each spin selects one student. They won't be picked again until you reset.</p>
            </div>

            <div class="spinner-layout">
                <div class="wheel-stage">
                    <div class="winner-display">
                        <div class="winner-label" id="winner-label">Up next</div>
                        <div class="winner-name" id="winner-name"></div>
                    </div>
                    <div class="wheel-wrapper">
                        <div class="wheel-pointer"></div>
                        <canvas id="wheel-canvas" width="380" height="380"></canvas>
                    </div>
                    <button class="spin-btn" id="spin-btn" onclick="spinWheel()">Spin</button>
                </div>

                <aside class="picked-side">
                    <h3>Already picked</h3>
                    <div class="meta"><span id="picked-count">0</span> of <span id="pool-count">0</span></div>
                    <ul class="picked-list" id="picked-list"></ul>
                    <button class="btn-link reset-link" onclick="resetPicks()">Reset round</button>
                </aside>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">Copied to clipboard</div>

    <script>
        // ===== DATA =====
        const DEFAULT_STUDENTS = [
            'Adrian H', 'Alex R', 'Andreas P', 'Bella F', 'Blake B', 'Charles G',
            'Cooper A', 'Ellie S', 'Emelia S', 'Emma H', 'Jacob F', 'Joel R',
            'Katelyn S', 'Lila R', 'Macy H', 'McKay S', 'Naomi S', 'Nico C',
            'Olin H', 'Olivia P', 'Rebekah M', 'Ryder D', 'Sam P', 'Spencer C', 'Trent W'
        ];

        let allStudents = [...DEFAULT_STUDENTS];
        let absentSet = new Set();
        let pickedSet = new Set();
        let pickedOrder = [];
        let isSpinning = false;
        let wheelAngle = 0;
        let wheelNames = [];

        // ===== TABS =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
                document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `${target}-panel`));
                if (target === 'spinner') {
                    rebuildWheel();
                    drawWheel(wheelAngle);
                }
            });
        });

        // ===== HELPERS =====
        const getPresent = () => allStudents.filter(s => !absentSet.has(s));
        const getRemaining = () => getPresent().filter(s => !pickedSet.has(s));

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function esc(str) { return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

        // ===== ATTENDANCE RENDER =====
        function renderRoster() {
            const grid = document.getElementById('roster-grid');
            grid.innerHTML = allStudents.map(name => {
                const absent = absentSet.has(name);
                return `
                    <div class="roster-row ${absent ? 'absent' : ''}" onclick="toggleAbsent('${esc(name)}')">
                        <span class="roster-name">${escapeHtml(name)}</span>
                        <span class="check"></span>
                    </div>
                `;
            }).join('');
            const present = getPresent().length;
            document.getElementById('present-count').textContent = present;
            document.getElementById('absent-count').textContent = allStudents.length - present;
        }

        function toggleAbsent(name) {
            if (absentSet.has(name)) absentSet.delete(name);
            else absentSet.add(name);
            renderRoster();
            updatePickedMeta();
        }

        function addVisitor() {
            const input = document.getElementById('visitor-input');
            const name = input.value.trim();
            if (name && !allStudents.includes(name)) {
                allStudents.push(name);
                input.value = '';
                renderRoster();
                updatePickedMeta();
            }
        }

        // ===== EXPORT =====
        function todayStr() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }
        function attendanceText() {
            return getPresent().join('\n');
        }
        async function copyList() {
            try {
                await navigator.clipboard.writeText(attendanceText());
                showToast('Copied to clipboard');
            } catch {
                showToast('Copy failed');
            }
        }
        function downloadList() {
            const blob = new Blob([attendanceText()], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `attendance-${todayStr()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Downloaded');
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
        }

        // ===== SPINNER PICKED LIST =====
        function renderPicked() {
            const list = document.getElementById('picked-list');
            if (pickedOrder.length === 0) {
                list.innerHTML = `<div class="picked-empty">No one yet — give it a spin.</div>`;
            } else {
                list.innerHTML = pickedOrder.map((name, i) => `
                    <li><span>${escapeHtml(name)}</span><span class="index">${String(i + 1).padStart(2, '0')}</span></li>
                `).join('');
            }
            updatePickedMeta();
        }
        function updatePickedMeta() {
            document.getElementById('picked-count').textContent = pickedOrder.length;
            document.getElementById('pool-count').textContent = getPresent().length;
        }

        function resetPicks() {
            pickedSet.clear();
            pickedOrder = [];
            wheelAngle = 0;
            document.getElementById('winner-name').classList.remove('show');
            document.getElementById('winner-label').classList.remove('show');
            document.getElementById('winner-name').textContent = '';
            renderPicked();
            rebuildWheel();
            drawWheel(wheelAngle);
        }

        // ===== WHEEL =====
        const WHEEL_COLORS = [
            '#c9967b', '#a8a392', '#8b6f47', '#b8a99a',
            '#d9c5b3', '#7a6f5f', '#c4a98a', '#9c7c5c',
            '#bfae95', '#6b6660', '#cdb89c', '#a89380'
        ];

        function isLightColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 > 165;
        }

        function rebuildWheel() {
            wheelNames = getRemaining();
            document.getElementById('spin-btn').disabled = wheelNames.length === 0 || isSpinning;
        }

        function drawWheel(rotation) {
            const canvas = document.getElementById('wheel-canvas');
            const ctx = canvas.getContext('2d');
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = cx - 4;
            const names = wheelNames;
            const n = names.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (n === 0) {
                ctx.fillStyle = '#f0eadf';
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c9c0ad';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.fillStyle = '#8a847b';
                ctx.font = 'italic 400 18px Fraunces, Georgia, serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('No one left', cx, cy);
                return;
            }

            const sliceAngle = (Math.PI * 2) / n;
            for (let i = 0; i < n; i++) {
                const startA = rotation + i * sliceAngle;
                const endA = startA + sliceAngle;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, startA, endA);
                ctx.closePath();
                const fill = WHEEL_COLORS[i % WHEEL_COLORS.length];
                ctx.fillStyle = fill;
                ctx.fill();
                ctx.strokeStyle = 'rgba(28, 26, 23, 0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startA + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = isLightColor(fill) ? '#1c1a17' : '#fbf8f3';
                const fs = n <= 8 ? 15 : n <= 15 ? 13 : 11;
                ctx.font = `500 ${fs}px Inter, sans-serif`;
                ctx.fillText(names[i], r - 16, 0);
                ctx.restore();
            }

            // outer ring
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#1c1a17';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // hub
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#fbf8f3';
            ctx.fill();
            ctx.strokeStyle = '#1c1a17';
            ctx.lineWidth = 1.25;
            ctx.stroke();
        }

        function spinWheel() {
            if (isSpinning || wheelNames.length === 0) return;

            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            const canvas = document.getElementById('wheel-canvas');
            spinBtn.disabled = true;
            canvas.classList.add('spinning');
            document.getElementById('winner-label').classList.remove('show');
            document.getElementById('winner-name').classList.remove('show');

            const n = wheelNames.length;
            const sliceAngle = (Math.PI * 2) / n;
            const winnerIndex = Math.floor(Math.random() * n);
            const winnerName = wheelNames[winnerIndex];

            const baseTarget = -Math.PI / 2 - winnerIndex * sliceAngle - sliceAngle / 2;
            const fullSpins = (3 + Math.floor(Math.random() * 2)) * Math.PI * 2;
            const jitter = (Math.random() - 0.5) * sliceAngle * 0.6;
            const targetAngle = baseTarget - fullSpins + jitter;

            const startAngle = wheelAngle;
            const totalDelta = targetAngle - startAngle;
            const duration = 1800 + Math.random() * 500;
            const startTime = performance.now();

            const easeOutQuart = t => 1 - Math.pow(1 - t, 4);

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                wheelAngle = startAngle + totalDelta * easeOutQuart(t);
                drawWheel(wheelAngle);

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    canvas.classList.remove('spinning');

                    document.getElementById('winner-label').classList.add('show');
                    const nameEl = document.getElementById('winner-name');
                    nameEl.textContent = winnerName;
                    nameEl.classList.add('show');

                    pickedSet.add(winnerName);
                    pickedOrder.push(winnerName);
                    renderPicked();
                    fireConfetti();
                    rebuildWheel();
                }
            }

            requestAnimationFrame(animate);
        }

        // ===== CONFETTI (restrained) =====
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let particles = [];
        let confettiAnimating = false;

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        const CONFETTI_COLORS = ['#8b6f47', '#c9967b', '#a8a392', '#c4a98a', '#9c7c5c', '#7a6f5f'];

        class Particle {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 14;
                this.vy = Math.random() * -14 - 2;
                this.color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
                this.size = Math.random() * 5 + 3;
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 8;
                this.opacity = 1;
                this.gravity = 0.32;
                this.drag = 0.99;
            }
            update() {
                this.vy += this.gravity;
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;
                this.opacity -= 0.006;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 5, this.size, this.size / 2.5);
                ctx.restore();
            }
        }

        function fireConfetti() {
            const wheel = document.getElementById('wheel-canvas').getBoundingClientRect();
            const cx = wheel.left + wheel.width / 2;
            const cy = wheel.top + wheel.height / 2;
            for (let i = 0; i < 60; i++) particles.push(new Particle(cx, cy));
            if (!confettiAnimating) animateConfetti();
        }

        function animateConfetti() {
            confettiAnimating = true;
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            particles = particles.filter(p => p.opacity > 0 && p.y < confettiCanvas.height + 50);
            particles.forEach(p => { p.update(); p.draw(confettiCtx); });
            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                confettiAnimating = false;
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        // ===== INIT =====
        document.getElementById('visitor-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') addVisitor();
        });
        renderRoster();
        renderPicked();
        rebuildWheel();
        drawWheel(0);
    </script>
</body>
</html>
